<!DOCTYPE html>
<html>
<head>
<title>Our Anniversary ❤️</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:Arial;
  text-align:center;
}
.box{
  background:white;
  padding:30px;
  border-radius:20px;
  width:80%;
  box-shadow:0 0 20px #999;
}
h1{
  color:#ff4b6e;
}
p{
  font-size:18px;
  color:#555;
}
button{
  background:#ff4b6e;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:20px;
  font-size:16px;
}
</style>
</head>

<body>

<div class="box">
<h1>Happy Anniversary ❤️</h1>

<p>
9 months with you has been special ✨<br>
Thank you for all the memories, smiles and moments.
<br><br>
You are a very important person in my life ❤️
</p>

<button onclick="show()">Click Here 💖</button>

<p id="msg"></p>

</div>

<script>
function show(){
document.getElementById("msg").innerHTML=
"Forever grateful for you ❤️✨";
}
</script>

</body>
</html>
